# Provider auto-configuration in Spring AI 1.1 is single-model: each starter
# activates when spring.ai.model.<kind> is missing OR equals that provider.
# With every starter on the classpath, leaving the properties unset would try
# to build OpenAI, Anthropic, Mistral, and Ollama at once, and a missing API
# key would stop startup. "none" matches none of them. ChatClients are created
# explicitly in ChatProviderConfiguration, only for providers that are configured.
spring:
  application:
    name: llm-gateway
  threads:
    virtual:
      enabled: true
  main:
    web-application-type: servlet
  ai:
    chat:
      client:
        enabled: false
    model:
      chat: none
      embedding: none
      image: none
      ocr: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      pgvector:
        initialize-schema: false
  autoconfigure:
    exclude:
      # A missing database must not stop the chat endpoints. RagDataSourceConfiguration
      # opens PostgreSQL only when SPRING_DATASOURCE_URL is set.
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

llm:
  http:
    connect-timeout: ${LLM_CONNECT_TIMEOUT:5s}
    read-timeout: ${LLM_READ_TIMEOUT:120s}
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
    grok:
      # xAI is OpenAI-compatible. The Spring AI OpenAI client appends /v1/chat/completions,
      # so the base URL is the host root (https://api.x.ai), not https://api.x.ai/v1.
      api-key: ${XAI_API_KEY:}
      base-url: ${XAI_BASE_URL:https://api.x.ai}
      model: ${XAI_MODEL:grok-4.7}
    mistral:
      api-key: ${MISTRAL_API_KEY:}
      base-url: ${MISTRAL_BASE_URL:https://api.mistral.ai}
      model: ${MISTRAL_MODEL:mistral-small-latest}
    ollama:
      enabled: ${OLLAMA_ENABLED:true}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2}
  embeddings:
    # One model for the whole vector store. The chat provider can still change per request.
    # xAI has no embeddings API. Default is a local multilingual ONNX model so RAG does not
    # need a paid key. See the README for the trade-off against OpenAI and Ollama.
    provider: ${EMBEDDING_PROVIDER:transformers}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    transformers:
      model-uri: ${TRANSFORMERS_MODEL_URI:https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx}
      tokenizer-uri: ${TRANSFORMERS_TOKENIZER_URI:https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json}
      model-output-name: ${TRANSFORMERS_OUTPUT_NAME:last_hidden_state}
      cache-directory: ${TRANSFORMERS_CACHE_DIR:${java.io.tmpdir}/llm-gateway-onnx}
  rag:
    default-top-k: ${RAG_TOP_K:4}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.30}
    # paraphrase-multilingual-MiniLM-L12-v2 truncates at 128 tokens. Stay under that.
    chunk-size: ${RAG_CHUNK_SIZE:120}
    min-chunk-size-chars: ${RAG_MIN_CHUNK_CHARS:40}
    samples:
      enabled: ${RAG_LOAD_SAMPLES:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    io.github.micha1805.llmgateway: INFO
